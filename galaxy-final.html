<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>中秋快乐 · 银河粒子</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23ffd98a'/%3E%3Ccircle cx='37' cy='37' r='9' fill='%23e8b45f' opacity='.6'/%3E%3Ccircle cx='62' cy='55' r='7' fill='%23e8b45f' opacity='.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@300;400;500&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #070b20; }
  body {
    font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: rgba(255, 240, 214, .92);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
  }
  canvas#rain { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 1; }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; z-index: 2; }
  canvas#firework {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    pointer-events: none; z-index: 3; opacity: 0; transition: opacity 1.5s ease;
  }
  canvas#firework.active { opacity: 1; }
  .kicker {
    position: fixed; top: max(18px, env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%);
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-weight: 600; font-size: 14px; letter-spacing: .62em; text-indent: .62em;
    color: rgba(255, 230, 190, .62);
    white-space: nowrap; pointer-events: none; z-index: 5;
    text-shadow: 0 0 14px rgba(0,0,0,.55);
    animation: kickIn 1.6s cubic-bezier(.22,1,.36,1) both;
  }
  @keyframes kickIn { from { opacity: 0; letter-spacing: 1em; } to { opacity: 1; letter-spacing: .62em; } }
  .splash {
    position: fixed; inset: 0; z-index: 9;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at 50% 42%, #0c1230 0%, #060a1e 70%);
    transition: opacity 0.9s ease; pointer-events: none;
  }
  .splash span {
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-weight: 900; color: rgba(255, 217, 138, .96);
    font-size: clamp(34px, 7vw, 62px);
    letter-spacing: .42em; text-indent: .42em;
    text-shadow: 0 0 30px rgba(255, 217, 138, .55), 0 0 80px rgba(255, 217, 138, .22);
    animation: splashPulse 2s ease-in-out infinite;
  }
  .splash.done { opacity: 0; visibility: hidden; }
  @keyframes splashPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.045); opacity: .85; } }
  #refreshHint {
    position: fixed; bottom: clamp(60px, 12vh, 120px); left: 50%;
    transform: translateX(-50%);
    font-family: "Noto Serif SC", "Songti SC", serif;
    font-weight: 600; font-size: clamp(13px, 2.5vw, 18px);
    letter-spacing: 0.32em; text-indent: 0.32em;
    color: rgba(255, 217, 138, 0.95);
    padding: 14px 34px; background: rgba(10, 20, 40, 0.75);
    border: 1px solid rgba(255, 217, 138, 0.55); border-radius: 40px;
    opacity: 0; visibility: hidden;
    transition: opacity 1.4s ease, visibility 0s linear 1.4s;
    z-index: 8; pointer-events: none; white-space: nowrap;
    text-shadow: 0 0 16px rgba(255, 217, 138, 0.7);
    box-shadow: 0 0 40px rgba(255, 217, 138, 0.35), inset 0 0 20px rgba(255, 217, 138, 0.08);
  }
  #refreshHint.show { opacity: 1; visibility: visible; transition: opacity 1.4s ease, visibility 0s linear 0s; animation: hintBreathe 2.4s ease-in-out infinite 1.4s; }
  @keyframes hintBreathe { 0%, 100% { box-shadow: 0 0 40px rgba(255,217,138,.35), inset 0 0 20px rgba(255,217,138,.08); } 50% { box-shadow: 0 0 60px rgba(255,217,138,.55), inset 0 0 30px rgba(255,217,138,.15); } }
</style>
</head>
<body>
<div class="splash" id="splash"><span>月满中秋</span></div>
<canvas id="rain" aria-label="代码洪流背景"></canvas>
<canvas id="scene" aria-label="银河粒子动画"></canvas>
<canvas id="firework" aria-label="赛博礼花彩蛋"></canvas>
<div class="kicker">代码洪流 · 月下寄思</div>
<div id="refreshHint">刷新页面 · 重新播放</div>
<audio id="bgm" src="assets/bgm.mp3" loop preload="metadata"></audio>

<script>
'use strict';
/* ============================================================
   中秋 · 银河粒子 · 诗句文字 · 单次播放版
   流程：银河漩涡(12s) → 十二句粒子诗(48s) → 银河+礼花(13s) → 停
   自适应性能：低端机自动降粒子数、降帧、关特效
   ============================================================ */
const TAU = Math.PI * 2;
const SERIF = '"Noto Serif SC","Songti SC","STSong","SimSun",serif';
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= 0. 性能自适应检测 ================= */
const PERF = (function() {
  const cores = navigator.hardwareConcurrency || 4;
  const mem = navigator.deviceMemory || 4;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const screenArea = window.innerWidth * window.innerHeight;

  let tier = 'high';
  if (cores <= 4 || mem <= 4 || screenArea < 400000) tier = 'low';
  else if (cores <= 6 || mem <= 6) tier = 'mid';
  if (isTouch && screenArea < 600000 && tier === 'high') tier = 'mid';

  const cfg = {
    low:  { particles: 1500, targetFps: 30, glow: false, rainDensity: 0.4, stars: 60, lanterns: 2, petals: 8, moonGlowLayers: 1 },
    mid:  { particles: 3000, targetFps: 45, glow: true,  rainDensity: 0.7, stars: 120, lanterns: 3, petals: 16, moonGlowLayers: 2 },
    high: { particles: 5000, targetFps: 60, glow: true,  rainDensity: 1.0, stars: 200, lanterns: 4, petals: 24, moonGlowLayers: 3 },
  }[tier];

  return { tier, ...cfg, dpr, screenArea };
})();
console.log('[Perf] tier=' + PERF.tier + ' particles=' + PERF.particles + ' fps=' + PERF.targetFps);

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const rainCanvas = document.getElementById('rain');
const rainCtx = rainCanvas.getContext('2d');
const splash = document.getElementById('splash');
setTimeout(() => splash.classList.add('done'), 700);
setTimeout(() => splash.remove(), 1800);

let W = 0, H = 0, DPR = 1;
const FRAME_INTERVAL = 1000 / PERF.targetFps;
let frameAccum = 0, lastFrameTime = 0;

/* ================= 1. 诗句 ================= */
const SCENES = [
  '海上生明月，天涯共此时',
  '但愿人长久，千里共婵娟',
  '露从今夜白，月是故乡明',
  '今夜月明人尽望，不知秋思落谁家',
  '秋空明月悬，光彩露沾湿',
  '圆魄上寒空，皆言四海同',
  '明月出天山，苍茫云海间',
  '春江潮水连海平，海上明月共潮生',
  '举头望明月，低头思故乡',
  '中庭地白树栖鸦，冷露无声湿桂花',
  '星垂平野阔，月涌大江流',
  '月落乌啼霜满天，江枫渔火对愁眠',
];

/* ================= 2. 粒子池 ================= */
const MAX_PARTICLES = PERF.particles;
const parts = {
  x: new Float32Array(MAX_PARTICLES),
  y: new Float32Array(MAX_PARTICLES),
  vx: new Float32Array(MAX_PARTICLES),
  vy: new Float32Array(MAX_PARTICLES),
  tx: new Float32Array(MAX_PARTICLES),
  ty: new Float32Array(MAX_PARTICLES),
  size: new Float32Array(MAX_PARTICLES),
  hue: new Float32Array(MAX_PARTICLES),
  alpha: new Float32Array(MAX_PARTICLES),
  count: MAX_PARTICLES,
};

/* ================= 3. 银河漩涡 ================= */
const GalaxySwirl = {
  cx: 0, cy: 0, rotation: 0,
  rotationSpeed: 0.008, gravity: 0.0008, drag: 0.995,
  init() {
    this.cx = W / 2; this.cy = H / 2; this.rotation = 0;
    const maxR = Math.min(W, H) * 0.45;
    for (let i = 0; i < parts.count; i++) {
      const angle = Math.random() * TAU;
      const radius = 50 + Math.random() * maxR;
      parts.x[i] = this.cx + Math.cos(angle) * radius;
      parts.y[i] = this.cy + Math.sin(angle) * radius * 0.45;
      parts.vx[i] = 0; parts.vy[i] = 0;
      parts.hue[i] = 180 + (radius / maxR) * 120;
      parts.size[i] = 0.8 + Math.random() * 2;
      parts.alpha[i] = 0.4 + Math.random() * 0.6;
    }
  },
  update(dt) {
    this.rotation += this.rotationSpeed * dt;
    for (let i = 0; i < parts.count; i++) {
      const dx = this.cx - parts.x[i];
      const dy = this.cy - parts.y[i];
      const distSq = dx * dx + dy * dy;
      const dist = Math.sqrt(distSq) || 1;
      const force = this.gravity * (1 / (distSq * 0.001 + 1));
      parts.vx[i] += (dx / dist) * force * dt * 60;
      parts.vy[i] += (dy / dist) * force * dt * 60;
      const tangentX = -dy / dist;
      const tangentY = dx / dist;
      const swirlForce = 0.15 * (1 / (dist * 0.01 + 1));
      parts.vx[i] += tangentX * swirlForce * dt * 60;
      parts.vy[i] += tangentY * swirlForce * dt * 60;
      parts.vx[i] *= this.drag; parts.vy[i] *= this.drag;
      parts.x[i] += parts.vx[i] * dt * 60;
      parts.y[i] += parts.vy[i] * dt * 60;
      const t = Math.min(1, dist / (Math.min(W, H) * 0.5));
      parts.hue[i] = 180 + t * 120;
      parts.alpha[i] = 0.3 + (1 - t) * 0.7;
    }
  }
};

/* ================= 4. 文字粒子 ================= */
const ParticleText = {
  textIndex: 0, timer: 0, duration: 3.5,
  gatherStrength: 0.12, jitterStrength: 0.3,
  init() {
    for (let i = 0; i < parts.count; i++) {
      parts.x[i] = Math.random() * W;
      parts.y[i] = Math.random() * H;
      parts.vx[i] = 0; parts.vy[i] = 0;
      parts.hue[i] = 40 + Math.random() * 30;
      parts.size[i] = 0.8 + Math.random() * 2;
      parts.alpha[i] = 0.3 + Math.random() * 0.7;
    }
    this.textIndex = 0; this.timer = 0;
    this.sampleText();
  },
  sampleText() {
    const text = SCENES[this.textIndex];
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const octx = off.getContext('2d');
    const isPhone = W < 768;
    const isTablet = W >= 768 && W < 1024;

    // 字号计算：手机端更大更清晰
    let fontSize;
    if (isPhone) {
      fontSize = Math.min(W / (text.length * 0.9), H * 0.07);
    } else if (isTablet) {
      fontSize = Math.min(W / (text.length * 0.92), H * 0.08);
    } else {
      fontSize = Math.min(W / (text.length * 0.95), H * 0.09);
    }

    // 文字垂直位置：手机偏下一点避免和月亮重叠
    let textY;
    if (isPhone) textY = H * 0.38;
    else if (isTablet) textY = H * 0.35;
    else textY = H * 0.32;

    octx.fillStyle = '#fff';
    octx.font = `900 ${fontSize}px ${SERIF}`;
    octx.textAlign = 'center';
    octx.textBaseline = 'middle';
    octx.fillText(text, W / 2, textY);

    const imgData = octx.getImageData(0, 0, W, H).data;
    const points = [];
    const step = isPhone ? 4 : (isTouch ? 4 : 3);
    for (let y = 0; y < H; y += step) {
      for (let x = 0; x < W; x += step) {
        if (imgData[(y * W + x) * 4 + 3] > 128) points.push([x, y]);
      }
    }
    if (points.length > 0) {
      for (let i = 0; i < parts.count; i++) {
        const p = points[i % points.length];
        parts.tx[i] = p[0] + (Math.random() - 0.5) * 2;
        parts.ty[i] = p[1] + (Math.random() - 0.5) * 2;
      }
    }
  },
  update(dt) {
    this.timer += dt;
    if (this.timer > this.duration) {
      this.timer = 0;
      this.textIndex++;
      if (this.textIndex >= SCENES.length) {
        PhaseController.switchTo('finale');
        return;
      }
      this.sampleText();
    }
    for (let i = 0; i < parts.count; i++) {
      const dx = parts.tx[i] - parts.x[i];
      const dy = parts.ty[i] - parts.y[i];
      parts.vx[i] += dx * this.gatherStrength * dt * 60;
      parts.vy[i] += dy * this.gatherStrength * dt * 60;
      parts.vx[i] += (Math.random() - 0.5) * this.jitterStrength;
      parts.vy[i] += (Math.random() - 0.5) * this.jitterStrength;
      parts.vx[i] *= 0.92; parts.vy[i] *= 0.92;
      parts.x[i] += parts.vx[i] * dt * 60;
      parts.y[i] += parts.vy[i] * dt * 60;
    }
  }
};

/* ================= 5. 阶段控制器 ================= */
const PhaseController = {
  current: 'galaxy',
  timer: 0,
  galaxyDuration: 6,
  finaleDuration: 12,
  finished: false,
  init() {
    this.current = 'galaxy';
    this.timer = 0;
    this.finished = false;
    GalaxySwirl.init();
  },
  update(dt) {
    if (this.finished) {
      GalaxySwirl.update(dt * 0.15);
      return;
    }
    this.timer += dt;
    if (this.current === 'galaxy') {
      if (this.timer >= this.galaxyDuration) {
        this.switchTo('text');
        return;
      }
      GalaxySwirl.update(dt);
    } else if (this.current === 'text') {
      ParticleText.update(dt);
    } else if (this.current === 'finale') {
      GalaxySwirl.update(dt);
      if (this.timer >= this.finaleDuration) {
        this.finish();
      }
    }
  },
  switchTo(mode) {
    this.current = mode;
    this.timer = 0;
    if (mode === 'text') {
      ParticleText.init();
    } else if (mode === 'finale') {
      GalaxySwirl.init();
      if (window.cyberFirework && !window.__fireworkStarted) {
        window.__fireworkStarted = true;
        setTimeout(() => window.cyberFirework.start(), 800);
      }
    }
  },
  finish() {
    if (this.finished) return;
    this.finished = true;
    const hint = document.getElementById('refreshHint');
    if (hint) hint.classList.add('show');
  }
};

/* ================= 6. 代码雨 ================= */
const RAIN_CHARS = ['0', '1'];
const codeRain = { cols: [], fs: 15 };
function resetRain() {
  codeRain.fs = isTouch ? 13 : 17;
  const g = rainCtx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#060a1e'); g.addColorStop(0.52, '#0c1230'); g.addColorStop(1, '#181238');
  rainCtx.fillStyle = g; rainCtx.fillRect(0, 0, W, H);
  const n = Math.ceil(W / codeRain.fs * PERF.rainDensity) + 1;
  codeRain.cols = [];
  for (let i = 0; i < n; i++) {
    codeRain.cols.push({
      x: (i / PERF.rainDensity) * codeRain.fs + codeRain.fs / 2,
      y: -Math.random() * H,
      sp: 0.9 + Math.random() * 2.2,
      len: 5 + ((Math.random() * 8) | 0)
    });
  }
}
function drawRain() {
  rainCtx.fillStyle = 'rgba(5,8,22,0.10)';
  rainCtx.fillRect(0, 0, W, H);
  rainCtx.font = 'bold ' + codeRain.fs + 'px "Noto Sans SC","Microsoft YaHei",monospace';
  rainCtx.textAlign = 'center';
  const maxA = isTouch ? 0.28 : 0.38;
  for (const col of codeRain.cols) {
    col.y += col.sp;
    if (col.y - col.len * codeRain.fs > H) {
      col.y = -Math.random() * H * 0.6;
      col.sp = 0.9 + Math.random() * 2.2;
      col.len = 5 + ((Math.random() * 8) | 0);
    }
    for (let i = 0; i < col.len; i++) {
      const yy = col.y - i * codeRain.fs;
      if (yy < -codeRain.fs || yy > H + codeRain.fs) continue;
      const ch = RAIN_CHARS[(Math.random() * 2) | 0];
      const fade = 1 - i / col.len;
      if (i === 0) rainCtx.fillStyle = 'rgba(255,222,150,' + (maxA * 0.95) + ')';
      else if (Math.random() < 0.1) rainCtx.fillStyle = 'rgba(130,230,200,' + (maxA * fade * 0.8) + ')';
      else rainCtx.fillStyle = 'rgba(255,205,120,' + (maxA * fade * 0.55) + ')';
      rainCtx.fillText(ch, col.x, yy);
    }
  }
}

/* ================= 7. 背景元素 ================= */
let stars = [], lanterns = [], petals = [];
const moon = { x: 0, y: 0, r: 0 };
const CRATERS = [
  [-0.34, -0.3, 0.15], [0.3, 0.24, 0.11], [0.05, -0.55, 0.07],
  [-0.12, 0.42, 0.09], [0.42, -0.12, 0.06], [-0.5, 0.08, 0.07],
];
function makeStars() {
  stars = [];
  const n = PERF.stars;
  for (let i = 0; i < n; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      r: 0.35 + Math.random() * 1.25,
      ph: Math.random() * TAU, sp: 0.5 + Math.random() * 1.8,
      big: Math.random() < 0.1,
      c: Math.random() < 0.82 ? [255, 231, 190] : [186, 212, 255]
    });
  }
}
function drawStars(t) {
  for (const s of stars) {
    const tw = 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
    const a = (0.2 + 0.5 * tw) * (s.big ? 1 : 0.85);
    ctx.fillStyle = 'rgba(' + s.c[0] + ',' + s.c[1] + ',' + s.c[2] + ',' + a + ')';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
    if (s.big && tw > 0.6) {
      ctx.globalAlpha = (tw - 0.6) * 0.5;
      ctx.strokeStyle = 'rgba(255,236,200,.8)'; ctx.lineWidth = 0.6;
      ctx.beginPath();
      ctx.moveTo(s.x - s.r * 3.2, s.y); ctx.lineTo(s.x + s.r * 3.2, s.y);
      ctx.moveTo(s.x, s.y - s.r * 3.2); ctx.lineTo(s.x, s.y + s.r * 3.2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}
function drawMoon() {
  const mx = moon.x, my = moon.y, R = moon.r;
  // 光晕：低端机1层，高端机多层
  const glowLayers = PERF.moonGlowLayers;
  if (glowLayers >= 1) {
    const glow = ctx.createRadialGradient(mx, my, R * 0.2, mx, my, R * 3.0);
    glow.addColorStop(0, 'rgba(255,214,140,0.28)');
    glow.addColorStop(0.5, 'rgba(255,214,140,0.08)');
    glow.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(mx, my, R * 3.0, 0, TAU); ctx.fill();
  }
  if (glowLayers >= 2) {
    const glow2 = ctx.createRadialGradient(mx, my, R * 0.5, mx, my, R * 5.5);
    glow2.addColorStop(0, 'rgba(255,214,140,0.10)');
    glow2.addColorStop(1, 'rgba(255,214,140,0)');
    ctx.fillStyle = glow2;
    ctx.beginPath(); ctx.arc(mx, my, R * 5.5, 0, TAU); ctx.fill();
  }
  const m = ctx.createRadialGradient(mx - R * 0.25, my - R * 0.32, R * 0.1, mx, my, R);
  m.addColorStop(0, '#fffbe9'); m.addColorStop(0.62, '#ffe3a4'); m.addColorStop(1, '#f0b254');
  ctx.fillStyle = m;
  ctx.beginPath(); ctx.arc(mx, my, R, 0, TAU); ctx.fill();
  if (PERF.tier !== 'low') {
    for (const c of CRATERS) {
      ctx.fillStyle = 'rgba(196,143,72,0.26)';
      ctx.beginPath(); ctx.arc(mx + c[0] * R, my + c[1] * R, c[2] * R, 0, TAU); ctx.fill();
    }
  }
}
function newLantern(anywhere) {
  return {
    x: W * (0.1 + Math.random() * 0.8),
    y: anywhere ? H * (0.22 + Math.random() * 0.7) : H + 50,
    ph: Math.random() * TAU, sp: 0.3 + Math.random() * 0.5,
    r: 5 + Math.random() * 5, hue: 26 + Math.random() * 18,
    a: 0.45 + Math.random() * 0.35
  };
}
function makeLanterns() {
  lanterns = [];
  for (let i = 0; i < PERF.lanterns; i++) lanterns.push(newLantern(true));
}
function drawLanterns(dt) {
  for (const l of lanterns) {
    l.y -= (13 + l.r * 1.1) * dt;
    l.ph += dt * l.sp;
    l.x += Math.sin(l.ph) * 0.4;
    if (l.y < -70) Object.assign(l, newLantern(false));
    const g = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r * 5);
    g.addColorStop(0, 'hsla(' + l.hue + ',95%,62%,' + (0.42 * l.a) + ')');
    g.addColorStop(1, 'hsla(40,95%,62%,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(l.x, l.y, l.r * 5, 0, TAU); ctx.fill();
    ctx.fillStyle = 'hsla(' + l.hue + ',92%,72%,' + l.a + ')';
    ctx.fillRect(l.x - l.r * 0.6, l.y - l.r * 0.85, l.r * 1.2, l.r * 1.5);
    ctx.fillStyle = 'rgba(70,45,20,0.7)';
    ctx.fillRect(l.x - l.r * 0.85, l.y - l.r * 1.0, l.r * 1.7, 1.5);
  }
}
function newPetal(anywhere) {
  return {
    x: Math.random() * W,
    y: anywhere ? Math.random() * H : -18 - Math.random() * 40,
    vy: 11 + Math.random() * 20, vx: -5 + Math.random() * 10,
    rot: Math.random() * TAU, vr: -1.2 + Math.random() * 2.4,
    s: 3 + Math.random() * 4.5, a: 0.26 + Math.random() * 0.3,
    dust: Math.random() < 0.4
  };
}
function makePetals() {
  petals = [];
  const n = PERF.petals;
  for (let i = 0; i < n; i++) petals.push(newPetal(true));
}
function drawPetals(dt) {
  for (const pt of petals) {
    pt.y += pt.vy * dt;
    pt.x += pt.vx * dt + Math.sin(pt.rot * 2) * 0.3;
    pt.rot += pt.vr * dt;
    if (pt.y > H + 30) Object.assign(pt, newPetal(false));
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(pt.rot);
    if (pt.dust) {
      ctx.fillStyle = 'rgba(255,226,170,' + pt.a + ')';
      ctx.beginPath(); ctx.arc(0, 0, pt.s * 0.45, 0, TAU); ctx.fill();
    } else {
      ctx.fillStyle = 'hsla(42,82%,74%,' + pt.a + ')';
      for (let i = 0; i < 4; i++) {
        ctx.rotate(Math.PI / 2);
        ctx.beginPath();
        ctx.ellipse(0, -pt.s * 0.52, pt.s * 0.4, pt.s * 0.48, 0, 0, TAU);
        ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,240,200,0.55)';
      ctx.beginPath(); ctx.arc(0, 0, pt.s * 0.22, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }
}

/* ================= 8. 绘制粒子 ================= */
function drawParticles() {
  for (let i = 0; i < parts.count; i++) {
    const alpha = parts.alpha[i];
    if (alpha < 0.02) continue;
    const size = parts.size[i];
    ctx.beginPath();
    ctx.arc(parts.x[i], parts.y[i], size, 0, TAU);
    ctx.fillStyle = `hsla(${parts.hue[i]}, 100%, 65%, ${alpha})`;
    ctx.fill();
    if (PERF.glow && size > 1.8) {
      ctx.beginPath();
      ctx.arc(parts.x[i], parts.y[i], size * 2.8, 0, TAU);
      ctx.fillStyle = `hsla(${parts.hue[i]}, 100%, 80%, ${alpha * 0.12})`;
      ctx.fill();
    }
  }
}

/* ================= 9. 诗句文字已由粒子组成，无需额外绘制 ================= */

/* ================= 10. 尺寸（响应式适配手机/平板/电脑） ================= */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  rainCanvas.width = W * DPR; rainCanvas.height = H * DPR;
  rainCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  resetRain();

  // 月亮位置与大小：按设备类型分档，避开文字区域
  const isPhone = W < 768;
  const isTablet = W >= 768 && W < 1024;
  if (isPhone) {
    moon.x = W * 0.5;
    moon.y = H * 0.14;
    moon.r = Math.max(28, Math.min(W * 0.18, H * 0.09));
  } else if (isTablet) {
    moon.x = W * 0.85;
    moon.y = H * 0.15;
    moon.r = Math.max(42, Math.min(W, H) * 0.1);
  } else {
    moon.x = W * 0.82;
    moon.y = H * 0.16;
    moon.r = Math.max(40, Math.min(W, H) * 0.115);
  }

  makeStars(); makeLanterns(); makePetals();
  PhaseController.init();
}
let rsT = 0;
window.addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(resize, 200); });

/* ================= 11. 主循环（带帧率自适应） ================= */
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, last ? (t - last) / 1000 : 0.016);
  last = t;

  // 物理逻辑每帧都跑，保证动画速度正确
  PhaseController.update(dt);

  // 渲染按目标帧率执行，低端机省一半GPU
  frameAccum += dt * 1000;
  if (frameAccum >= FRAME_INTERVAL) {
    frameAccum = 0;
    drawRain();
    ctx.clearRect(0, 0, W, H);
    drawStars(t / 1000);
    drawMoon();
    drawLanterns(dt);
    drawPetals(dt);
    drawParticles();
  }

  requestAnimationFrame(frame);
}

/* ================= 12. 背景音乐 ================= */
const bgm = document.getElementById('bgm');
function startMusic() { const p = bgm.play(); if (p && p.catch) p.catch(() => {}); }
function unlockOnce() { startMusic(); window.removeEventListener('pointerdown', unlockOnce); window.removeEventListener('touchstart', unlockOnce); }
window.addEventListener('pointerdown', unlockOnce);
window.addEventListener('touchstart', unlockOnce);

/* ================= 13. 启动 ================= */
function init() {
  resize(); startMusic();
  if (reduceMotion) { resetRain(); drawRain(); ctx.clearRect(0, 0, W, H); drawStars(0); drawMoon(); return; }
  requestAnimationFrame(frame);
}
if (reduceMotion) { init(); } else {
  Promise.race([
    Promise.all([
      document.fonts.load('900 120px "Noto Serif SC"'),
      document.fonts.load('400 16px "Noto Sans SC"')
    ]),
    new Promise(r => setTimeout(r, 1000))
  ]).then(init).catch(init);
}

/* ================= 14. 礼花彩蛋 ================= */
const CyberFirework = (function() {
  const PALETTE = [
    { h: 186, s: 100, l: 62 }, { h: 312, s: 100, l: 66 },
    { h: 268, s: 100, l: 72 }, { h: 48,  s: 100, l: 64 },
    { h: 158, s: 100, l: 58 }, { h: 20,  s: 100, l: 62 },
  ];
  const canvas = document.getElementById('firework');
  const ctx = canvas.getContext('2d');
  let fw = 0, fh = 0, fdpr = 1;
  let rockets = [], particles = [];
  let running = false, lastTs = 0, nextLaunchIn = 0, launched = false;
  let elapsed = 0;
  const LAUNCH_DURATION = 10;
  const MAX_TOTAL_DURATION = 14;

  function resizeFw() {
    fdpr = Math.min(window.devicePixelRatio || 1, 2);
    fw = window.innerWidth; fh = window.innerHeight;
    canvas.width = fw * fdpr; canvas.height = fh * fdpr;
    ctx.setTransform(fdpr, 0, 0, fdpr, 0, 0);
  }
  function launch() {
    const color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
    rockets.push({
      x: fw * 0.2 + Math.random() * fw * 0.6,
      y: fh + 20,
      targetY: fh * 0.15 + Math.random() * fh * 0.35,
      vx: (Math.random() - 0.5) * 60,
      vy: -(fh * 0.9 + Math.random() * fh * 0.2),
      color: color, trail: [],
    });
  }
  function explode(r) {
    const count = PERF.tier === 'low'
      ? 30 + Math.floor(Math.random() * 20)
      : PERF.tier === 'mid'
        ? 50 + Math.floor(Math.random() * 30)
        : 70 + Math.floor(Math.random() * 50);
    const baseSpeed = 150 + Math.random() * 100;
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * TAU;
      const speed = baseSpeed * (0.3 + Math.random() * 0.7);
      particles.push({
        x: r.x, y: r.targetY,
        vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: 1, decay: 0.8 + Math.random() * 0.5,
        size: 1.5 + Math.random() * 2, color: r.color,
      });
    }
  }
  function loop(ts) {
    if (!running) return;
    const dt = Math.min((ts - lastTs) / 1000, 0.05);
    lastTs = ts;
    elapsed += dt;
    if (elapsed < LAUNCH_DURATION) {
      nextLaunchIn -= dt;
      if (nextLaunchIn <= 0) {
        launch();
        if (Math.random() < 0.4) launch();
        nextLaunchIn = 0.5 + Math.random() * 1.0;
      }
    }
    ctx.fillStyle = 'rgba(7, 11, 32, 0.12)';
    ctx.fillRect(0, 0, fw, fh);
    ctx.globalCompositeOperation = 'lighter';
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      r.x += r.vx * dt; r.y += r.vy * dt; r.vy += 780 * 0.3 * dt;
      r.trail.push({ x: r.x, y: r.y });
      if (r.trail.length > 8) r.trail.shift();
      for (let j = 0; j < r.trail.length; j++) {
        const t = r.trail[j];
        const a = j / r.trail.length;
        ctx.beginPath(); ctx.arc(t.x, t.y, 2 * a, 0, TAU);
        ctx.fillStyle = `hsla(${r.color.h}, ${r.color.s}%, ${r.color.l}%, ${a * 0.8})`;
        ctx.fill();
      }
      ctx.beginPath(); ctx.arc(r.x, r.y, 3, 0, TAU);
      ctx.fillStyle = `hsla(${r.color.h}, 100%, 80%, 1)`;
      ctx.fill();
      if (r.y <= r.targetY || r.vy >= 0) { explode(r); rockets.splice(i, 1); }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 780 * dt;
      p.vx *= 0.985; p.vy *= 0.985; p.life -= p.decay * dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      const alpha = Math.max(p.life, 0);
      const flicker = 0.7 + Math.random() * 0.3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, TAU);
      ctx.fillStyle = `hsla(${p.color.h}, ${p.color.s}%, ${p.color.l}%, ${alpha * flicker})`;
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    if (elapsed >= MAX_TOTAL_DURATION && rockets.length === 0 && particles.length === 0) {
      running = false;
      canvas.classList.remove('active');
      return;
    }
    requestAnimationFrame(loop);
  }
  function start() {
    if (launched) return;
    launched = true;
    canvas.classList.add('active');
    resizeFw();
    window.addEventListener('resize', resizeFw);
    running = true;
    lastTs = performance.now();
    nextLaunchIn = 0.3;
    elapsed = 0;
    for (let i = 0; i < 5; i++) setTimeout(() => launch(), i * 200);
    requestAnimationFrame(loop);
  }
  return { start };
})();
window.cyberFirework = CyberFirework;
</script>
